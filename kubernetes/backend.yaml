apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: enterprise-rag
  labels:
    app.kubernetes.io/name: rag-backend
    app.kubernetes.io/part-of: enterprise-agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-backend
        app.kubernetes.io/part-of: enterprise-agentic-rag
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: backend
          image: enterprise-agentic-rag-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: rag-backend-secrets
          env:
            - name: PORT
              value: "8000"
            - name: ENVIRONMENT
              value: development
            - name: STRICT_STARTUP
              value: "false"
            - name: TRUSTED_HOSTS
              value: rag-backend,localhost,127.0.0.1
            - name: CORS_ORIGINS
              value: http://rag.localhost:8080,http://localhost:3000,http://127.0.0.1:3000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: rag-backend
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: rag-backend
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              httpHeaders:
                - name: Host
                  value: rag-backend
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: enterprise-rag
  labels:
    app.kubernetes.io/name: rag-backend
    app.kubernetes.io/part-of: enterprise-agentic-rag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
