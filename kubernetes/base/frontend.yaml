apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: enterprise-rag
  labels:
    app.kubernetes.io/name: rag-frontend
    app.kubernetes.io/part-of: enterprise-agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-frontend
        app.kubernetes.io/part-of: enterprise-agentic-rag
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: frontend
          image: enterprise-agentic-rag-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: RAG_API_URL
              value: http://rag-backend:8000
            - name: RAG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-backend-secrets
                  key: RAG_API_KEY
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsUser: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: enterprise-rag
  labels:
    app.kubernetes.io/name: rag-frontend
    app.kubernetes.io/part-of: enterprise-agentic-rag
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
