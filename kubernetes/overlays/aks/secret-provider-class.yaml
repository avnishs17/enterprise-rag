          key: PORTKEY_PRIMARY_CONFIG_ID
        - objectName: PORTKEY_PRIMARY_SLUG
          key: PORTKEY_PRIMARY_SLUG
        - objectName: PRIMARY_MODEL
          key: PRIMARY_MODEL
        - objectName: QDRANT_API_KEY
          key: QDRANT_API_KEY
        - objectName: QDRANT_URL
          key: QDRANT_URL
        - objectName: RAG_API_KEY
          key: RAG_API_KEY
        - objectName: RATE_LIMIT_PER_MINUTE
          key: RATE_LIMIT_PER_MINUTE
        - objectName: TRUSTED_HOSTS
          key: TRUSTED_HOSTS
        - objectName: UPSTASH_REDIS_REST_TOKEN
          key: UPSTASH_REDIS_REST_TOKEN
        - objectName: UPSTASH_REDIS_REST_URL
          key: UPSTASH_REDIS_REST_URL
        - objectName: USE_PORTKEY
          key: USE_PORTKEY
  parameters:
    clientID: __KEYVAULT_WORKLOAD_CLIENT_ID__
    keyvaultName: __KEYVAULT_NAME__
    tenantId: __AZURE_TENANT_ID__
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    workloadIdentity: "true"
    objects: |
      array:
        - |
          objectName: backend-url
          objectType: secret
          objectAlias: BACKEND_URL
        - |
          objectName: environment
          objectType: secret
          objectAlias: ENVIRONMENT
        - |
          objectName: fallback-model
          objectType: secret
          objectAlias: FALLBACK_MODEL
        - |
          objectName: groq-api-key
          objectType: secret
          objectAlias: GROQ_API_KEY
        - |
          objectName: groq-base-url
          objectType: secret
          objectAlias: GROQ_BASE_URL
        - |
          objectName: groq-model
          objectType: secret
          objectAlias: GROQ_MODEL
        - |
          objectName: groq-model-b
          objectType: secret
          objectAlias: GROQ_MODEL_B
        - |
          objectName: guardrail-provider
          objectType: secret
          objectAlias: GUARDRAIL_PROVIDER
        - |
          objectName: jina-api-key
          objectType: secret
          objectAlias: JINA_API_KEY
        - |
          objectName: jina-embedding-url
          objectType: secret
          objectAlias: JINA_EMBEDDING_URL
        - |
          objectName: jina-model
          objectType: secret
          objectAlias: JINA_MODEL
        - |
          objectName: jina-rate-limit-delay
          objectType: secret
          objectAlias: JINA_RATE_LIMIT_DELAY
        - |
          objectName: jina-rerank-model
          objectType: secret
          objectAlias: JINA_RERANK_MODEL
        - |
          objectName: jina-rerank-url
          objectType: secret
          objectAlias: JINA_RERANK_URL
        - |
          objectName: judge-groq-api-key
          objectType: secret
          objectAlias: JUDGE_GROQ_API_KEY
        - |
          objectName: langsmith-api-key
          objectType: secret
          objectAlias: LANGSMITH_API_KEY
        - |
          objectName: langsmith-endpoint
          objectType: secret
          objectAlias: LANGSMITH_ENDPOINT
        - |
          objectName: langsmith-project
          objectType: secret
          objectAlias: LANGSMITH_PROJECT
        - |
          objectName: langsmith-tracing
          objectType: secret
          objectAlias: LANGSMITH_TRACING
        - |
          objectName: logfire-base-url
          objectType: secret
          objectAlias: LOGFIRE_BASE_URL
        - |
          objectName: logfire-project
          objectType: secret
          objectAlias: LOGFIRE_PROJECT
        - |
          objectName: logfire-token
          objectType: secret
          objectAlias: LOGFIRE_TOKEN
        - |
          objectName: max-upload-bytes
          objectType: secret
          objectAlias: MAX_UPLOAD_BYTES
        - |
          objectName: mem0-api-key
          objectType: secret
          objectAlias: MEM0_API_KEY
        - |
          objectName: nebius-api-key
          objectType: secret
          objectAlias: NEBIUS_API_KEY
        - |
          objectName: nebius-base-url
          objectType: secret
          objectAlias: NEBIUS_BASE_URL
        - |
          objectName: nebius-model
          objectType: secret
          objectAlias: NEBIUS_MODEL
        - |
          objectName: neon-db-url
          objectType: secret
          objectAlias: NEON_DB_URL
        - |
          objectName: portkey-api-key
          objectType: secret
          objectAlias: PORTKEY_API_KEY
        - |
          objectName: portkey-fallback-slug
          objectType: secret
          objectAlias: PORTKEY_FALLBACK_SLUG
        - |
          objectName: portkey-primary-config-id
          objectType: secret
          objectAlias: PORTKEY_PRIMARY_CONFIG_ID
        - |
          objectName: portkey-primary-slug
          objectType: secret
          objectAlias: PORTKEY_PRIMARY_SLUG
        - |
          objectName: primary-model
          objectType: secret
          objectAlias: PRIMARY_MODEL
        - |
          objectName: qdrant-api-key
          objectType: secret
          objectAlias: QDRANT_API_KEY
        - |
          objectName: qdrant-url
          objectType: secret
          objectAlias: QDRANT_URL
        - |
          objectName: rag-api-key
          objectType: secret
          objectAlias: RAG_API_KEY
        - |
          objectName: rate-limit-per-minute
          objectType: secret
          objectAlias: RATE_LIMIT_PER_MINUTE
        - |
          objectName: trusted-hosts
          objectType: secret
          objectAlias: TRUSTED_HOSTS
        - |
          objectName: upstash-redis-rest-token
          objectType: secret
          objectAlias: UPSTASH_REDIS_REST_TOKEN
        - |
          objectName: upstash-redis-rest-url
          objectType: secret
          objectAlias: UPSTASH_REDIS_REST_URL
        - |
          objectName: use-portkey
          objectType: secret
          objectAlias: USE_PORTKEY
