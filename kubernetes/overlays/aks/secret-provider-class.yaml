apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rag-backend-keyvault
  namespace: enterprise-rag
spec:
  provider: azure
  secretObjects:
    - secretName: rag-backend-secrets
      type: Opaque
      data:
        - objectName: BACKEND_URL
          key: BACKEND_URL
        - objectName: ENVIRONMENT
          key: ENVIRONMENT
        - objectName: FALLBACK_MODEL
          key: FALLBACK_MODEL
        - objectName: GROQ_API_KEY
          key: GROQ_API_KEY
        - objectName: GROQ_BASE_URL
          key: GROQ_BASE_URL
        - objectName: GROQ_MODEL
          key: GROQ_MODEL
        - objectName: GROQ_MODEL_B
          key: GROQ_MODEL_B
        - objectName: GUARDRAIL_PROVIDER
          key: GUARDRAIL_PROVIDER
        - objectName: JINA_API_KEY
          key: JINA_API_KEY
        - objectName: JINA_EMBEDDING_URL
          key: JINA_EMBEDDING_URL
        - objectName: JINA_MODEL
          key: JINA_MODEL
        - objectName: JINA_RATE_LIMIT_DELAY
          key: JINA_RATE_LIMIT_DELAY
        - objectName: JINA_RERANK_MODEL
          key: JINA_RERANK_MODEL
        - objectName: JINA_RERANK_URL
          key: JINA_RERANK_URL
        - objectName: JUDGE_GROQ_API_KEY
          key: JUDGE_GROQ_API_KEY
        - objectName: LANGSMITH_API_KEY
          key: LANGSMITH_API_KEY
        - objectName: LANGSMITH_ENDPOINT
          key: LANGSMITH_ENDPOINT
        - objectName: LANGSMITH_PROJECT
          key: LANGSMITH_PROJECT
        - objectName: LANGSMITH_TRACING
          key: LANGSMITH_TRACING
        - objectName: LOGFIRE_BASE_URL
          key: LOGFIRE_BASE_URL
        - objectName: LOGFIRE_PROJECT
          key: LOGFIRE_PROJECT
        - objectName: LOGFIRE_TOKEN
          key: LOGFIRE_TOKEN
        - objectName: MAX_UPLOAD_BYTES
          key: MAX_UPLOAD_BYTES
        - objectName: MEM0_API_KEY
          key: MEM0_API_KEY
        - objectName: NEBIUS_API_KEY
          key: NEBIUS_API_KEY
        - objectName: NEBIUS_BASE_URL
          key: NEBIUS_BASE_URL
        - objectName: NEBIUS_MODEL
          key: NEBIUS_MODEL
        - objectName: NEON_DB_URL
          key: NEON_DB_URL
        - objectName: PORTKEY_API_KEY
          key: PORTKEY_API_KEY
        - objectName: PORTKEY_FALLBACK_SLUG
          key: PORTKEY_FALLBACK_SLUG
